name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  smoke-test-pipelines:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run baseline pipeline end-to-end
        run: python liver_disease_classification.py

      - name: Run ensemble pipeline end-to-end
        run: python liver_disease_ensemble.py

      - name: Run CLI prediction (fast mode)
        run: |
          python predict_patient.py --fast --age 60 --gender Male --total_bilirubin 8.5 \
            --direct_bilirubin 4.2 --alkphos 450 --alamine 90 --aspartate 110 \
            --total_proteins 6.0 --albumin 2.8 --ag_ratio 0.6

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: |
            outputs/
            outputs_ensemble/
          retention-days: 14
